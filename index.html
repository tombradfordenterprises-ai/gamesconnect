        /* ========================================
           HOME

        #homeScreen {

        .search-container {

        #checkersBoard {

        #checkersResult {
            text-align: center;

        }

        #checkersRematchButton {
            display: block;
            margin: 15px auto;
            padding: 12px 25px;

            border-radius: 10px;
            background: #2563eb;

        }

        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 600px) {

            .logo {
                font-size: 38px;
            }

            .subtitle {

            .game-title {

            }
        }

    </style>

</head>

            ></div>

    <script>

        // ========================================
        // BACKEND
        // ========================================

        const BACKEND_URL =
            "https://gamesconnect-1.onrender.com";


        // ========================================
        // GLOBAL VARIABLES
        // ========================================

        let socket = null;

        let currentGame = null;

        let currentRoomId = null;

        let currentTurn = null;

        let myPlayerIndex = null;

        let gameFinished = false;


        // ========================================
        // TIC TAC TOE VARIABLES
        // ========================================

        let tttBoard = [];

        let mySymbol = null;


        // ========================================
        // CHECKERS VARIABLES
        // ========================================

        let checkersBoard = null;

        let checkersSelected = null;

        let checkersLegalMoves = [];

        let checkersMustContinue = null;


        // ========================================
        // CONNECT WEBSOCKET
        // ========================================

        function connectWebSocket() {

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {
                return;
            }

            const protocol =
                window.location.protocol === "https:"
                    ? "wss:"
                    : "ws:";

            const wsUrl =
                protocol +
                "//" +
                BACKEND_URL.replace(
                    /^https?:\/\//,
                    ""
                );

            console.log(
                "Connecting to:",
                wsUrl
            );

            socket =
                new WebSocket(wsUrl);


            socket.onopen = function () {

                console.log(
                    "WebSocket connected"
                );

            };


            socket.onclose = function () {

                console.log(
                    "WebSocket disconnected"
                );

            };


            socket.onerror = function (error) {

                console.error(
                    "WebSocket error:",
                    error
                );

            };


            socket.onmessage =
                function (event) {

                    let message;

                    try {

                        message =
                            JSON.parse(
                                event.data
                            );

                    } catch (error) {

                        console.error(
                            "Invalid server message:",
                            event.data
                        );

                        return;
                    }

                    console.log(
                        "SERVER MESSAGE:",
                        message
                    );

                    handleServerMessage(
                        message
                    );

                };

        }


        // ========================================
        // FIND MATCH
        // ========================================

        function findMatch(game) {

            if (
                game === "battleship"
            ) {

                alert(
                    "Battleship is coming soon."
                );

                return;
            }

            currentGame = game;

            showScreen(
                "searchScreen"
            );

            document.getElementById(
                "searchTitle"
            ).textContent =
                game === "checkers"
                    ? "Finding Checkers Opponent"
                    : "Finding Tic-Tac-Toe Opponent";

            document.getElementById(
                "searchStatus"
            ).textContent =
                "Searching for another player...";

            connectWebSocket();

            waitForSocketAndSend({

                type: "find_match",

                game: game

            });

        }


        // ========================================
        // WAIT FOR SOCKET
        // ========================================

        function waitForSocketAndSend(
            message
        ) {

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify(message)
                );

                return;
            }

            setTimeout(
                function () {

                    waitForSocketAndSend(
                        message
                    );

                },
                100
            );

        }


        // ========================================
        // CANCEL SEARCH
        // ========================================

        function cancelSearch() {

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({

                        type:
                            "cancel_search"

                    })
                );

            }

            goHome();

        }


        // ========================================
        // HANDLE SERVER MESSAGE
        // ========================================

        function handleServerMessage(
            message
        ) {

            switch (
                message.type
            ) {


                // ================================
                // CONNECTED
                // ================================

                case "connected":

                    console.log(
                        "Connected as:",
                        message.name
                    );

                    break;


                // ================================
                // SEARCHING
                // ================================

                case "searching":

                    document.getElementById(
                        "searchStatus"
                    ).textContent =
                        "Waiting for another player...";

                    break;


                // ================================
                // MATCH FOUND
                // ================================

                case "match_found":

                    currentRoomId =
                        message.roomId;

                    myPlayerIndex =
                        message.playerIndex;

                    currentGame =
                        message.game;

                    console.log(
                        "MATCH FOUND:",
                        message
                    );

                    showScreen(
                        "gameScreen"
                    );

                    setupGameScreen();

                    break;


                // ================================
                // TIC TAC TOE START
                // ================================

                case "tictactoe_start":

                    currentTurn =
                        message.currentTurn;

                    myPlayerIndex =
                        message.playerIndex;

                    mySymbol =
                        message.yourSymbol;

                    tttBoard =
                        Array.isArray(
                            message.board
                        )
                            ? message.board
                            : Array(9).fill("");

                    gameFinished =
                        false;

                    document.getElementById(
                        "tttResult"
                    ).textContent =
                        "";

                    document.getElementById(
                        "rematchButton"
                    ).classList.add(
                        "hidden"
                    );

                    updateTicTacToeStatus();

                    renderTicTacToe();

                    break;


                // ================================
                // TIC TAC TOE UPDATE
                // ================================

                case "tictactoe_update":

                    currentTurn =
                        message.currentTurn;

                    myPlayerIndex =
                        message.playerIndex;

                    tttBoard =
                        Array.isArray(
                            message.board
                        )
                            ? message.board
                            : Array(9).fill("");

                    updateTicTacToeStatus();

                    renderTicTacToe();

                    break;


                // ================================
                // TIC TAC TOE RESULT
                // ================================

                case "tictactoe_result":

                    gameFinished =
                        true;

                    currentTurn =
                        null;

                    tttBoard =
                        message.board;

                    renderTicTacToe();

                    document.getElementById(
                        "tttResult"
                    ).textContent =
                        message.result === "win"
                            ? "You Win!"
                            : message.result === "loss"
                                ? "You Lose!"
                                : "Draw!";

                    document.getElementById(
                        "rematchButton"
                    ).classList.remove(
                        "hidden"
                    );

                    break;


                // ================================
                // REMATCH WAITING
                // ================================

                case "rematch_waiting":

                    document.getElementById(
                        "tttResult"
                    ).textContent =
                        "Waiting for your opponent...";

                    break;


                // ================================
                // CHECKERS UPDATE
                // ================================

                case "checkers_update":

                    console.log(
                        "CHECKERS UPDATE RECEIVED:",
                        message
                    );

                    currentTurn =
                        message.currentTurn;

                    myPlayerIndex =
                        message.playerIndex;

                    checkersBoard =
                        message.board;

                    checkersMustContinue =
                        message.mustContinue;

                    gameFinished =
                        false;

                    checkersSelected =
                        null;

                    checkersLegalMoves =
                        [];

                    document.getElementById(
                        "checkersResult"
                    ).classList.add(
                        "hidden"
                    );

                    document.getElementById(
                        "checkersRematchButton"
                    ).classList.add(
                        "hidden"
                    );

                    updateCheckersHeader();

                    renderCheckersBoard();

                    break;


                // ================================
                // CHECKERS RESULT
                // ================================

                case "checkers_result":

                    console.log(
                        "CHECKERS RESULT:",
                        message
                    );

                    gameFinished =
                        true;

                    currentTurn =
                        null;

                    checkersBoard =
                        message.board;

                    checkersSelected =
                        null;

                    checkersLegalMoves =
                        [];

                    renderCheckersBoard();

                    const resultElement =
                        document.getElementById(
                            "checkersResult"
                        );

                    resultElement.classList.remove(
                        "hidden"
                    );

                    resultElement.textContent =
                        message.result === "win"
                            ? "You Win!"
                            : "You Lose!";

                    document.getElementById(
                        "checkersRematchButton"
                    ).classList.remove(
                        "hidden"
                    );

                    break;


                // ================================
                // CHECKERS INVALID MOVE
                // ================================

                case "checkers_invalid_move":

                    console.log(
                        "CHECKERS INVALID MOVE:",
                        message.reason
                    );

                    alert(
                        message.reason
                    );

                    break;


                // ================================
                // CHECKERS REMATCH WAITING
                // ================================

                case "checkers_rematch_waiting":

                    document.getElementById(
                        "checkersResult"
                    ).classList.remove(
                        "hidden"
                    );

                    document.getElementById(
                        "checkersResult"
                    ).textContent =
                        "Waiting for your opponent...";

                    break;


                // ================================
                // OPPONENT LEFT
                // ================================

                case "opponent_left":

                    alert(
                        "Your opponent left the game."
                    );

                    goHome();

                    break;


                // ================================
                // SEARCH CANCELLED
                // ================================

                case "search_cancelled":

                    goHome();

                    break;

            }

        }


        // ========================================
        // SETUP GAME SCREEN
        // ========================================

        function setupGameScreen() {

            document.getElementById(
                "ticTacToeArea"
            ).classList.add(
                "hidden"
            );

            document.getElementById(
                "checkersArea"
            ).classList.add(
                "hidden"
            );

            document.getElementById(
                "battleshipArea"
            ).classList.add(
                "hidden"
            );

            if (
                currentGame ===
                "tictactoe"
            ) {

                document.getElementById(
                    "gameTitle"
                ).textContent =
                    "Tic-Tac-Toe";

                document.getElementById(
                    "ticTacToeArea"
                ).classList.remove(
                    "hidden"
                );

            }

            if (
                currentGame ===
                "checkers"
            ) {

                document.getElementById(
                    "gameTitle"
                ).textContent =
                    "Checkers";

                document.getElementById(
                    "checkersArea"
                ).classList.remove(
                    "hidden"
                );

                document.getElementById(
                    "checkersStatus"
                ).textContent =
                    "Waiting for game...";

            }

            if (
                currentGame ===
                "battleship"
            ) {

                document.getElementById(
                    "gameTitle"
                ).textContent =
                    "Battleship";

                document.getElementById(
                    "battleshipArea"
                ).classList.remove(
                    "hidden"
                );

            }

        }


        // ========================================
        // TIC TAC TOE RENDER
        // ========================================

        function renderTicTacToe() {

            const boardElement =
                document.getElementById(
                    "tttBoard"
                );

            boardElement.innerHTML = "";

            for (
                let i = 0;
                i < 9;
                i++
            ) {

                const cell =
                    document.createElement(
                        "button"
                    );

                cell.className =
                    "ttt-cell";

                cell.textContent =
                    tttBoard[i] || "";

                cell.disabled =
                    gameFinished ||
                    tttBoard[i] !== "" ||
                    currentTurn !==
                        myPlayerIndex;

                cell.onclick =
                    function () {

                        makeTicTacToeMove(
                            i
                        );

                    };

                boardElement.appendChild(
                    cell
                );

            }

        }


        // ========================================
        // TIC TAC TOE MOVE
        // ========================================

        function makeTicTacToeMove(
            position
        ) {

            if (
                !socket ||
                socket.readyState !==
                WebSocket.OPEN
            ) {
                return;
            }

            if (
                gameFinished
            ) {
                return;
            }

            if (
                currentTurn !==
                myPlayerIndex
            ) {
                return;
            }

            socket.send(
                JSON.stringify({

                    type:
                        "tictactoe_move",

                    position:
                        position

                })
            );

        }


        // ========================================
        // TIC TAC TOE STATUS
        // ========================================

        function updateTicTacToeStatus() {

            const status =
                document.getElementById(
                    "gameStatus"
                );

            if (
                gameFinished
            ) {
                status.textContent =
                    "Game finished";

                return;
            }

            if (
                currentTurn ===
                myPlayerIndex
            ) {

                status.textContent =
                    "Your turn";

            } else {

                status.textContent =
                    "Opponent's turn";

            }

        }


        // ========================================
        // TIC TAC TOE REMATCH
        // ========================================

        function requestTicTacToeRematch() {

            if (
                !socket ||
                socket.readyState !==
                WebSocket.OPEN
            ) {
                return;
            }

            socket.send(
                JSON.stringify({

                    type:
                        "tictactoe_rematch"

                })
            );

        }


        // ========================================
        // CHECKERS RENDER
        // ========================================

        function renderCheckersBoard() {

            const boardElement =
                document.getElementById(
                    "checkersBoard"
                );

            if (!boardElement) {

                console.error(
                    "CHECKERS: board element missing"
                );

                return;
            }

            console.log(
                "CHECKERS: rendering board"
            );

            console.log(
                "CHECKERS BOARD DATA:",
                checkersBoard
            );


            /*
                Always create a valid 8x8 board.

                If the server hasn't supplied
                the board yet, use an empty board
                so that the board itself still
                appears.
            */

            let board =
                Array.from(
                    { length: 8 },
                    () =>
                        Array(8).fill(null)
                );


            if (
                Array.isArray(
                    checkersBoard
                ) &&
                checkersBoard.length === 8
            ) {

                let validBoard = true;

                for (
                    let row = 0;
                    row < 8;
                    row++
                ) {

                    if (
                        !Array.isArray(
                            checkersBoard[row]
                        ) ||
                        checkersBoard[row].length !== 8
                    ) {

                        validBoard = false;

                        break;
                    }

                }

                if (validBoard) {

                    board =
                        checkersBoard;

                }

            }


            // ====================================
            // CLEAR BOARD
            // ====================================

            boardElement.innerHTML = "";


            // ====================================
            // FORCE BOARD GRID
            // ====================================

            boardElement.style.display =
                "grid";

            boardElement.style.gridTemplateColumns =
                "repeat(8, 1fr)";

            boardElement.style.gridTemplateRows =
                "repeat(8, 1fr)";

            boardElement.style.width =
                "min(92vw, 560px)";

            boardElement.style.height =
                "min(92vw, 560px)";

            boardElement.style.aspectRatio =
                "1 / 1";

            boardElement.style.margin =
                "0 auto";

            boardElement.style.border =
                "6px solid #111827";

            boardElement.style.boxSizing =
                "border-box";

            boardElement.style.overflow =
                "hidden";


            // ====================================
            // CREATE 64 SQUARES
            // ====================================

            for (
                let row = 0;
                row < 8;
                row++
            ) {

                for (
                    let col = 0;
                    col < 8;
                    col++
                ) {

                    const square =
                        document.createElement(
                            "div"
                        );


                    // =================================
                    // SQUARE COLOR
                    // =================================

                    square.style.backgroundColor =
                        (row + col) % 2 === 0
                            ? "#f0d9b5"
                            : "#8b5a2b";

                    square.style.width =
                        "100%";

                    square.style.height =
                        "100%";

                    square.style.minWidth =
                        "0";

                    square.style.minHeight =
                        "0";

                    square.style.display =
                        "flex";

                    square.style.alignItems =
                        "center";

                    square.style.justifyContent =
                        "center";

                    square.style.position =
                        "relative";

                    square.style.boxSizing =
                        "border-box";

                    square.style.cursor =
                        "pointer";


                    // =================================
                    // CLICK
                    // =================================

                    square.onclick =
                        function () {

                            handleCheckersSquareClick(
                                row,
                                col
                            );

                        };


                    // =================================
                    // SELECTED
                    // =================================

                    if (
                        checkersSelected &&
                        checkersSelected.row === row &&
                        checkersSelected.col === col
                    ) {

                        square.style.boxShadow =
                            "inset 0 0 0 5px #22c55e";

                    }


                    // =================================
                    // LEGAL MOVE
                    // =================================

                    const legalMove =
                        checkersLegalMoves.find(
                            move =>
                                move.row === row &&
                                move.col === col
                        );

                    if (
                        legalMove
                    ) {

                        const marker =
                            document.createElement(
                                "div"
                            );

                        marker.className =
                            "legal-marker";

                        if (
                            legalMove.capture
                        ) {

                            marker.classList.add(
                                "capture-marker"
                            );

                        }

                        square.appendChild(
                            marker
                        );

                    }


                    // =================================
                    // PIECE
                    // =================================

                    const piece =
                        board[row][col];


                    if (piece) {

                        const pieceElement =
                            document.createElement(
                                "div"
                            );

                        pieceElement.className =
                            "checker-piece";


                        // =================================
                        // RED
                        // =================================

                        if (
                            piece === "r" ||
                            piece === "R"
                        ) {

                            pieceElement.classList.add(
                                "piece-red"
                            );

                        }


                        // =================================
                        // BLACK
                        // =================================

                        if (
                            piece === "b" ||
                            piece === "B"
                        ) {

                            pieceElement.classList.add(
                                "piece-black"
                            );

                        }


                        // =================================
                        // KING
                        // =================================

                        if (
                            piece === "R" ||
                            piece === "B"
                        ) {

                            pieceElement.classList.add(
                                "piece-king"
                            );

                            pieceElement.textContent =
                                "♛";

                        }

                        square.appendChild(
                            pieceElement
                        );

                    }


                    // =================================
                    // ADD SQUARE
                    // =================================

                    boardElement.appendChild(
                        square
                    );

                }

            }


            console.log(
                "CHECKERS: board rendered with",
                boardElement.children.length,
                "squares"
            );

        }


        // ========================================
        // CHECKERS CLICK
        // ========================================

        function handleCheckersSquareClick(
            row,
            col
        ) {

            if (
                gameFinished
            ) {
                return;
            }

            if (
                currentTurn !==
                myPlayerIndex
            ) {

                return;
            }


            const piece =
                checkersBoard &&
                Array.isArray(
                    checkersBoard[row]
                )
                    ? checkersBoard[row][col]
                    : null;


            // ====================================
            // SELECT PIECE
            // ====================================

            if (!checkersSelected) {

                if (!piece) {
                    return;
                }


                const owner =
                    (
                        piece === "r" ||
                        piece === "R"
                    )
                        ? 0
                        : (
                            piece === "b" ||
                            piece === "B"
                        )
                            ? 1
                            : null;


                if (
                    owner !==
                    myPlayerIndex
                ) {

                    return;
                }


                checkersSelected = {

                    row: row,

                    col: col

                };


                calculateCheckersLegalMoves(
                    row,
                    col
                );


                renderCheckersBoard();

                return;

            }


            // ====================================
            // CLICK SAME PIECE
            // ====================================

            if (
                checkersSelected.row === row &&
                checkersSelected.col === col
            ) {

                checkersSelected =
                    null;

                checkersLegalMoves =
                    [];

                renderCheckersBoard();

                return;

            }


            // ====================================
            // CHECK LEGAL MOVE
            // ====================================

            const legalMove =
                checkersLegalMoves.find(
                    move =>
                        move.row === row &&
                        move.col === col
                );


            if (!legalMove) {

                /*
                    If the user clicked another
                    friendly piece, select that
                    piece instead.
                */

                if (piece) {

                    const owner =
                        (
                            piece === "r" ||
                            piece === "R"
                        )
                            ? 0
                            : (
                                piece === "b" ||
                                piece === "B"
                            )
                                ? 1
                                : null;


                    if (
                        owner ===
                        myPlayerIndex
                    ) {

                        checkersSelected = {

                            row: row,

                            col: col

                        };

                        calculateCheckersLegalMoves(
                            row,
                            col
                        );

                        renderCheckersBoard();

                    }

                }

                return;

            }


            // ====================================
            // SEND MOVE
            // ====================================

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify({

                        type:
                            "checkers_move",

                        fromRow:
                            checkersSelected.row,

                        fromCol:
                            checkersSelected.col,

                        toRow:
                            row,

                        toCol:
                            col

                    })
                );

            }


            checkersSelected =
                null;

            checkersLegalMoves =
                [];

        }


        // ========================================
        // CHECKERS LEGAL MOVES
        // ========================================

        function calculateCheckersLegalMoves(
            row,
            col
        ) {

            checkersLegalMoves =
                [];


            if (
                !Array.isArray(
                    checkersBoard
                )
            ) {
                return;
            }


            const piece =
                checkersBoard[row][col];


            if (!piece) {
                return;
            }


            const owner =
                (
                    piece === "r" ||
                    piece === "R"
                )
                    ? 0
                    : 1;


            // ====================================
            // DIRECTIONS
            // ====================================

            let directions;


            const king =
                piece === "R" ||
                piece === "B";


            if (king) {

                directions = [

                    [-1, -1],

                    [-1, 1],

                    [1, -1],

                    [1, 1]

                ];

            } else if (
                owner === 0
            ) {

                directions = [

                    [1, -1],

                    [1, 1]

                ];

            } else {

                directions = [

                    [-1, -1],

                    [-1, 1]

                ];

            }


            // ====================================
            // DETERMINE IF CAPTURE IS REQUIRED
            // ====================================

            let mustCapture =
                false;


            for (
                let r = 0;
                r < 8;
                r++
            ) {

                for (
                    let c = 0;
                    c < 8;
                    c++
                ) {

                    const other =
                        checkersBoard[r][c];

                    if (!other) {
                        continue;
                    }


                    const otherOwner =
                        (
                            other === "r" ||
                            other === "R"
                        )
                            ? 0
                            : 1;


                    if (
                        otherOwner !==
                        myPlayerIndex
                    ) {
                        continue;
                    }


                    if (
                        getClientCaptureMoves(
                            r,
                            c
                        ).length > 0
                    ) {

                        mustCapture = true;

                    }

                }

            }


            // ====================================
            // GET CAPTURES
            // ====================================

            if (mustCapture) {

                checkersLegalMoves =
                    getClientCaptureMoves(
                        row,
                        col
                    );

                return;

            }


            // ====================================
            // NORMAL MOVES
            // ====================================

            for (
                const direction
                of directions
            ) {

                const newRow =
                    row +
                    direction[0];

                const newCol =
                    col +
                    direction[1];


                if (
                    newRow < 0 ||
                    newRow >= 8 ||
                    newCol < 0 ||
                    newCol >= 8
                ) {

                    continue;

                }


                if (
                    !checkersBoard[newRow][newCol]
                ) {

                    checkersLegalMoves.push({

                        row:
                            newRow,

                        col:
                            newCol,

                        capture:
                            false

                    });

                }

            }

        }


        // ========================================
        // CLIENT CAPTURE MOVES
        // ========================================

        function getClientCaptureMoves(
            row,
            col
        ) {

            const moves = [];


            if (
                !Array.isArray(
                    checkersBoard
                )
            ) {

                return moves;

            }


            const piece =
                checkersBoard[row][col];


            if (!piece) {
                return moves;
            }


            const owner =
                (
                    piece === "r" ||
                    piece === "R"
                )
                    ? 0
                    : 1;


            const king =
                piece === "R" ||
                piece === "B";


            let directions;


            if (king) {

                directions = [

                    [-1, -1],

                    [-1, 1],

                    [1, -1],

                    [1, 1]

                ];

            } else if (
                owner === 0
            ) {

                directions = [

                    [1, -1],

                    [1, 1]

                ];

            } else {

                directions = [

                    [-1, -1],

                    [-1, 1]

                ];

            }


            for (
                const direction
                of directions
            ) {

                const middleRow =
                    row +
                    direction[0];

                const middleCol =
                    col +
                    direction[1];

                const landingRow =
                    row +
                    direction[0] * 2;

                const landingCol =
                    col +
                    direction[1] * 2;


                if (
                    landingRow < 0 ||
                    landingRow >= 8 ||
                    landingCol < 0 ||
                    landingCol >= 8
                ) {

                    continue;

                }


                if (
                    middleRow < 0 ||
                    middleRow >= 8 ||
                    middleCol < 0 ||
                    middleCol >= 8
                ) {

                    continue;

                }


                const middlePiece =
                    checkersBoard[
                        middleRow
                    ][
                        middleCol
                    ];


                const landingPiece =
                    checkersBoard[
                        landingRow
                    ][
                        landingCol
                    ];


                if (
                    middlePiece &&
                    (
                        (
                            middlePiece === "r" ||
                            middlePiece === "R"
                        )
                            ? 0
                            : 1
                    ) !== owner &&
                    !landingPiece
                ) {

                    moves.push({

                        row:
                            landingRow,

                        col:
                            landingCol,

                        capture:
                            true

                    });

                }

            }


            return moves;

        }


        // ========================================
        // CHECKERS HEADER
        // ========================================

        function updateCheckersHeader() {

            const status =
                document.getElementById(
                    "checkersStatus"
                );


            const players =
                document.getElementById(
                    "checkersPlayers"
                );


            players.textContent =
                myPlayerIndex === 0
                    ? "You are Red"
                    : "You are Black";


            if (
                gameFinished
            ) {

                status.textContent =
                    "Game finished";

                return;

            }


            if (
                currentTurn ===
                myPlayerIndex
            ) {

                if (
                    checkersMustContinue
                ) {

                    status.textContent =
                        "Your turn — continue capturing";

                } else {

                    status.textContent =
                        "Your turn";

                }

            } else {

                status.textContent =
                    "Opponent's turn";

            }

        }


        // ========================================
        // CHECKERS REMATCH
        // ========================================

        function requestCheckersRematch() {

            if (
                !socket ||
                socket.readyState !==
                WebSocket.OPEN
            ) {

                return;

            }

        // ========================================

        function showScreen(

        ) {

            ).classList.add(

            );

            ).classList.remove(

            );

        // ========================================
        // GO HOME
        // ========================================

        function goHome() {

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN &&
                currentRoomId
            ) {

                socket.send(

                        type:
                            "leave_game"

                    })
                );

            }


            currentGame =
                null;

            currentRoomId =
                null;

            currentTurn =
                null;

            myPlayerIndex =
                null;

            gameFinished =
                false;

            tttBoard =
                [];

            mySymbol =
                null;

            checkersBoard =
                null;

            checkersSelected =
                null;

            checkersLegalMoves =
                [];

            checkersMustContinue =
                null;


            showScreen(
                "homeScreen"
            );

        }


        // ========================================
        // START
        // ========================================

        connectWebSocket();

    </script>
